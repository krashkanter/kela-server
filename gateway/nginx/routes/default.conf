server {
    listen 80 default_server;
    server_name _;
    location = /healthz { access_log off; return 200 "phone-gateway healthy\n"; add_header Content-Type text/plain; }
    location /example/ { proxy_pass http://example/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://hello; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}